[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "romm-mcp"
version = "0.1.0"
description = "A typed Model Context Protocol server for bounded RomM library management through its authenticated API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ronald de Wit" }]
keywords = ["romm", "mcp", "model-context-protocol", "emulation", "game-library"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=1.12.0,<2.0",
  "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2"]

[project.scripts]
romm-mcp = "romm_mcp:main"

[project.urls]
Repository = "https://github.com/X1pheR/romm-mcp"
Issues = "https://github.com/X1pheR/romm-mcp/issues"
Upstream = "https://github.com/rommapp/romm"

[tool.hatch.build.targets.wheel]
packages = ["src/romm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
